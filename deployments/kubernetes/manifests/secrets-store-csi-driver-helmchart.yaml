apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: secrets-store-csi-driver
  namespace: kube-system
spec:
  targetNamespace: kube-system
  repo: https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
  chart: secrets-store-csi-driver
  # Pin a known stable version; update as needed
  version: 1.4.0
  valuesContent: |
    syncSecret.enabled: true
    enableSecretRotation: true
    rotationPollInterval: 2m
    logLevel: info
    linux:
      enabled: true
    windows:
      enabled: false
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: vault-csi-provider
  namespace: kube-system
spec:
  targetNamespace: kube-system
  # HashiCorp's Helm repo (contains Vault chart; provider is typically configured via manifests, adjust if using custom chart)
  repo: https://helm.releases.hashicorp.com
  chart: vault
  # Minimal Vault install acting as a provider; adjust for HA or external Vault if not needed.
  version: 0.28.0
  valuesContent: |
    global:
      enabled: false  # disable server components if using external Vault
    server:
      enabled: false
    csi:
      enabled: true
      # When using external Vault, set address via env or secret
      image:
        tag: latest
      resources: {}
    injector:
      enabled: false
    ui:
      enabled: false
